[package]
name = "freewipe"
version = "1.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["sleepme"]
repository = "https://github.com/sleepme/freewipe"
description = "Lightweight, open-source secure data wiping utility (files, directories, free space) with CLI and GUI"
keywords = ["secure-erase", "wipe", "shred", "privacy", "data-sanitization"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"
build = "build.rs"

[features]
default = ["gui"]
# The desktop GUI (freewipe-gui). Disable with `--no-default-features` for a
# CLI-only build with a much smaller dependency tree.
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:wgpu", "dep:windows", "dep:windows-core"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive", "string"] }
ctrlc = "3.4.7"
rpassword = "7.3.1"
indicatif = "0.18.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"

# Only what freewipe uses: wgpu renderer with the DirectX 12 and OpenGL
# backends, bundled fonts, clipboard and links (no accessibility tree,
# system-font lookup, Vulkan/Metal/WebGPU) — a much smaller executable.
eframe = { version = "0.37.0", optional = true, default-features = false, features = [
    "default_fonts",
    "clipboard",
    "links",
    "wgpu_no_default_features",
] }
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "dx12", "gles", "wgsl"] }
# Bundle the monochrome icon/emoji fonts so the UI looks the same on every
# machine instead of depending on installed system fonts.
egui = { version = "0.37.0", optional = true, features = ["monochrome_emoji_fonts"] }
rfd = { version = "0.17.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# COM drop-target server for the Explorer context menu (GUI only).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell_Common",
]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62.2"
optional = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.172"
# winit needs a display protocol on Linux (development builds only).
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["x11"] }

[build-dependencies]
winresource = "0.1.20"

[dev-dependencies]
tempfile = "3.20.0"

[lib]
name = "freewipe"
path = "src/lib.rs"

[[bin]]
name = "freewipe"
path = "src/main.rs"

[[bin]]
name = "freewipe-gui"
path = "src/bin/freewipe-gui/main.rs"
required-features = ["gui"]

[workspace]
members = [".", "shell"]

[profile.release]
# Size-optimised; the few crates on the hot path (random data, hashing and
# freewipe's own engine) are compiled for speed below.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.freewipe]
opt-level = 3
[profile.release.package.rand_chacha]
opt-level = 3
[profile.release.package.ppv-lite86]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3

[[example]]
name = "shell_client"
required-features = ["gui"]

# The Explorer extension runs inside explorer.exe: a panic must unwind (and is
# caught at the COM boundary) instead of aborting Explorer.
[profile.shell]
inherits = "release"
panic = "unwind"
opt-level = "z"
