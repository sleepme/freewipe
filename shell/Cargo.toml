[package]
name = "freewipe-shell"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sleepme"]
repository = "https://github.com/sleepme/freewipe"
description = "Explorer context-menu handler (IExplorerCommand) for freewipe"
publish = false

[lib]
name = "freewipe_shell"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
